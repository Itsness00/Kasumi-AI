    display: inline-block;
    padding: 8px 14px;
    border-radius: 10px;
    background: linear-gradient(90deg, #9D8CFF, #55DDE0);
    color: #0B1020;
    font-weight: 700;
    font-size: 12px;
    text-decoration: none;
  }
</style>
